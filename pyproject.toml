[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phi-guardrails"
version = "0.1.0"
description = "Local PHI simulation harness: CMS SYNPUF sample data loaded into a local Postgres DB to test LLM guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adbc-driver-postgresql==1.9.0",
    "pandas==3.0.6",
    "polars==1.44.2",
    "psycopg2-binary==2.9.11",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.hatch.build.targets.wheel]
packages = ["src/phi_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
