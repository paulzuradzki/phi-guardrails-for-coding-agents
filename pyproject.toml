[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phi-guardrails"
version = "0.1.0"
description = "Local PHI simulation harness: CMS SYNPUF sample data loaded into a local Postgres DB to test LLM guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "PLC0415"]

[tool.hatch.build.targets.wheel]
packages = ["src/phi_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail loudly instead of hanging forever (e.g. a DB lock wait).
timeout = 30
