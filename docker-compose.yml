services:
  postgres:
    image: postgres:16
    container_name: phi-guardrails-postgres
    # Creds come from .env; nothing is hardcoded in this file.
    # POSTGRES_USER/POSTGRES_PASSWORD create the superuser (human001) and
    # POSTGRES_DB creates the database.
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-claims_db}
      # Injected into the init script that creates the agent role.
      AGENT_DB_USER: ${AGENT_DB_USER:-agent001}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-human001} -d ${DB_NAME:-claims_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
